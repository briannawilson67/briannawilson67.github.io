<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table Quiz</title>
    <!-- Direct link to your local styles.css file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen" class="screen active">
        <h1>Periodic Table Quiz</h1>
        <div class="input-group">
            <label for="username">Enter name: </label>
            <input type="text" id="username">
        </div>
       <button onclick="startQuiz()" class="start-btn">START</button>
    </div>

    <!-- 2. QUIZ SCREEN -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-header">
            <span id="progress-text">Question 1 of 10</span> 
            <span style="margin-left: 20px;">Score: <span id="score-text">0</span></span>
        </div>
        
        <div id="question-text">Question text goes here...</div>
        
        <div class="options-container">
            <div id="opt0" class="option-box" onclick="selectOption(0)">Option 1</div>
            <div id="opt1" class="option-box" onclick="selectOption(1)">Option 2</div>
            <div id="opt2" class="option-box" onclick="selectOption(2)">Option 3</div>
            <div id="opt3" class="option-box" onclick="selectOption(3)">Option 4</div>
        </div>


        <button class="next-btn" onclick="nextQuestion()">NEXT</button>
    </div>

    <!-- 3. RESULTS SCREEN -->
    <div id="results-screen" class="screen">
        <h1>RESULTS</h1>
        <div id="final-score-text">You scored 0 out of 4!</div>
        <button class="start-btn" style="margin-top: 30px;" onclick="resetQuiz()">PLAY AGAIN</button>
    </div>

    <!-- Direct link to your local script.js file -->
    <script src="script.js"></script>
</body>
</html>
