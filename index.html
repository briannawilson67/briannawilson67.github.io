<!DOCTYPE html>
<html>
<head>
    <title>Periodic Table Quiz</title>
<link rel="stylesheet" href="styles.css">

</head>

<body>
 
    <div class="quiz-box">
 
        <h1>Periodic Table Quiz</h1>

        <p id="intro">Test your knowledge of the elements!</p>
           <p id="author">Made by Brianna</p>
           <!--start quiz button-->
        <button id="startButton" onclick="startQuiz()">Start Quiz</button>

        <div id="quiz" style="display:none;">

            <p id="number"></p>

            <h2 id="question"></h2>

            <div id="options"></div>

            <p id="feedback"></p>
           <!--this is the next button-->
            <button id="nextButton" onclick="nextQuestion()" disabled>
                Next Question
            </button>

        </div>
            
        <div id="result" style="display:none;">
            <h2>Quiz Finished!</h2>     
            <p id="score">
             <!--restart quiz button-->
            <button onclick="restartQuiz()">Play Again</button>
        </div>

    </div>
    
    <script src="script.js"></script>

</body>
</html>
