<!DOCTYPE html>
<html>
<head>
    <title>Periodic Table Quiz</title>
<link rel="stylesheet" href="styles.css">

</head>

<body>
 
    <div class="quiz-box">

        <h1>Periodic Table Quiz</h1>

        <p id="intro">Test your knowledge of the elements!</p>
           <p id="author">Made by Brianna</p>
        <button id="startButton" onclick="startQuiz()">Start Quiz</button>

        <div id="quiz" style="display:none;">

            <p id="number"></p>

            <h2 id="question"></h2>

            <div id="options"></div>

            <p id="feedback"></p>
            #This is to work the next button
            <button id="nextButton" onclick="nextQuestion()" disabled>
                Next Question
            </button>

        </div>
            #This is for the result page
        <div id="result" style="display:none;">
            <h2>Quiz Finished!</h2>     #Tells the user that the quiz is finished
            <p id="score"></p>
            #Gives the user an option to play again if needed
            <button onclick="restartQuiz()">Play Again</button>
        </div>

    </div>
    #links to javascript
    <script src="script.js"></script>

</body>
</html>
